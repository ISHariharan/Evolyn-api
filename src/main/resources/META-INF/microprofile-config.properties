# Values use ${ENV_VAR:local-default}: on Render you set the environment variables,
# on your laptop the defaults after the colon are used, so nothing changes locally.

# Render tells the app which port to listen on through PORT
server.port=${PORT:3001}
server.host=0.0.0.0

# Change the following to true to enable the optional MicroProfile Metrics REST.request metrics
metrics.rest-request.enabled=false

# Application properties. This is the default greeting
app.greeting=Hello

# ── Calls to Evolyn-Data-Service (every @RegisterRestClient uses this config key) ──
evolyn-data-service/mp-rest/url=${DATA_SERVICE_URL:http://localhost:3002}
# 90s: on Render's free plan a sleeping Data Service takes about a minute to wake up
evolyn-data-service/mp-rest/connectTimeout=${DATA_SERVICE_CONNECT_TIMEOUT_MS:90000}
evolyn-data-service/mp-rest/readTimeout=${DATA_SERVICE_READ_TIMEOUT_MS:90000}
# Pacing and retries for Data Service calls (see Common/DataServiceRetryInterceptor):
# at most this many calls at once, and a 429 from Render/Cloudflare is retried this many times
evolyn.data-service.max-concurrent=${DATA_SERVICE_MAX_CONCURRENT:4}
evolyn.data-service.retries=${DATA_SERVICE_RETRIES:3}
evolyn.data-service.retry-base-ms=${DATA_SERVICE_RETRY_BASE_MS:400}
# Adds the X-Internal-Key header to every call (see InternalKeyHeader)
evolyn-data-service/mp-rest/providers=com.evolyn.api.Common.InternalKeyHeader

# Shared secret with the Data Service. Empty locally; must be set in production.
evolyn.internal-api-key=${INTERNAL_API_KEY:}

# ── Login tokens (see Auth/TokenService) ──
# Secret used to sign login tokens. MUST be set on Render (a long random string,
# e.g. from: openssl rand -base64 48). Empty locally: a random one is made at
# start-up and everyone logs in again after a restart.
evolyn.auth.token-secret=${AUTH_TOKEN_SECRET:}
# How long a login lasts before you have to log in again
evolyn.auth.token-days=${AUTH_TOKEN_DAYS:7}

# ── Browser access (see Common/CorsFilter) ──
# Sites allowed to call this API from the browser, comma separated (exact origins, no paths).
# Add a new Vercel domain here, or set CORS_ALLOWED_ORIGINS on Render to replace the list.
evolyn.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://evolyn-mg16.vercel.app,https://evolyn-gamma.vercel.app}
