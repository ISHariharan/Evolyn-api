# Values use ${ENV_VAR:local-default}: on Render you set the environment variables,
# on your laptop the defaults after the colon are used, so nothing changes locally.

# Render tells the app which port to listen on through PORT
server.port=${PORT:3001}
server.host=0.0.0.0

# Change the following to true to enable the optional MicroProfile Metrics REST.request metrics
metrics.rest-request.enabled=false

# Application properties. This is the default greeting
app.greeting=Hello

# ── Calls to Evolyn-Data-Service (every @RegisterRestClient uses this config key) ──
evolyn-data-service/mp-rest/url=${DATA_SERVICE_URL:http://localhost:3002}
# 90s: on Render's free plan a sleeping Data Service takes about a minute to wake up
evolyn-data-service/mp-rest/connectTimeout=${DATA_SERVICE_CONNECT_TIMEOUT_MS:90000}
evolyn-data-service/mp-rest/readTimeout=${DATA_SERVICE_READ_TIMEOUT_MS:90000}
# Adds the X-Internal-Key header to every call (see InternalKeyHeader)
evolyn-data-service/mp-rest/providers=com.evolyn.api.Common.InternalKeyHeader

# Shared secret with the Data Service. Empty locally; must be set in production.
evolyn.internal-api-key=${INTERNAL_API_KEY:}
