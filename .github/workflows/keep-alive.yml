# Keeps Evolyn-API and Evolyn-Data-Service awake from 7:35 pm to 8:35 pm India time, every day.
#
# Render's free plan puts a service to sleep after 15 minutes without requests, and waking it
# takes about a minute. Pinging both every 10 minutes keeps them warm while people use the
# app, and lets them sleep the rest of the day (free plan hours last longer).
#
# GitHub's schedule is in UTC (India = UTC + 5:30) and the minutes avoid :00 (GitHub's
# busiest moment).
#   14:05-14:55 UTC = 7:35-8:25 pm IST
#   15:05 UTC       = 8:35 pm IST   (last ping 8:35 pm: asleep by about 8:50 pm)
#
# GitHub runs free scheduled jobs on a best-effort basis: they can start late or be skipped
# when GitHub is busy.
#
# Run it by hand from the Actions tab: "Keep services awake" > Run workflow.

name: Keep services awake

on:
  schedule:
    - cron: "5-55/10 14 * * *"
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping the API and the Data Service
        run: |
          ping() {
            name="$1"; url="$2"
            for try in 1 2 3; do
              # 90 s: a sleeping service takes about a minute to wake up
              code=$(curl -s -o /dev/null -m 90 -w "%{http_code}" "$url" || echo 000)
              echo "$name: try $try -> HTTP $code"
              [ "$code" = "200" ] && return 0
              sleep 20
            done
            # Warn instead of failing, so a bad evening doesn't send a failure email every 10 minutes
            echo "::warning::$name did not answer 200 at $url (last: HTTP $code)"
          }
          # Data Service first: the API's health check doesn't need it, but the app does
          ping "Data Service" "https://evolyn-data-service.onrender.com/health"
          ping "API" "https://evolyn-api-urbz.onrender.com/health"
