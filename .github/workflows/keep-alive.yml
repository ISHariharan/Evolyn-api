# Keeps Evolyn-API and Evolyn-Data-Service awake from 6 pm to 10 pm India time, every day.
#
# Render's free plan puts a service to sleep after 15 minutes without requests, and waking it
# takes about a minute. Pinging both every 10 minutes in the evening keeps them warm while
# people use the app, and lets them sleep the rest of the day (free plan hours last longer).
#
# GitHub's schedule is in UTC (India = UTC + 5:30), and scheduled runs can start a few minutes
# late, so the first ping is at 5:55 pm and the minutes avoid :00 (GitHub's busiest moment).
#   12:25-12:55 UTC = 5:55-6:25 pm IST
#   13:05-15:55 UTC = 6:35-9:25 pm IST
#   16:05-16:25 UTC = 9:35-9:55 pm IST   (last ping 9:55 pm: asleep by about 10:10 pm)
#
# Run it by hand from the Actions tab: "Keep services awake" > Run workflow.

name: Keep services awake

on:
  schedule:
    - cron: "25-55/10 12 * * *"
    - cron: "5-55/10 13-15 * * *"
    - cron: "5-25/10 16 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping the API and the Data Service
        run: |
          ping() {
            name="$1"; url="$2"
            for try in 1 2 3; do
              # 90 s: a sleeping service takes about a minute to wake up
              code=$(curl -s -o /dev/null -m 90 -w "%{http_code}" "$url" || echo 000)
              echo "$name: try $try -> HTTP $code"
              [ "$code" = "200" ] && return 0
              sleep 20
            done
            # Warn instead of failing, so a bad evening doesn't send a failure email every 10 minutes
            echo "::warning::$name did not answer 200 at $url (last: HTTP $code)"
          }
          # Data Service first: the API's health check doesn't need it, but the app does
          ping "Data Service" "https://evolyn-data-service.onrender.com/health"
          ping "API" "https://evolyn-api-urbz.onrender.com/health"
